type Post {
  id: ID!
  author: User!
  title: String
  categories: [Category!]!
  image: Picture
  published: Boolean!
  publishedAt: String
  content: JSON
  draft: JSON
  tags: [Tag!]!
  reactionsBy: [User!]!
  comments: [Comment!]!
  createdAt: String!
  updatedAt: String!
}

# Offset types start

type OffsetPostsResponse {
  data: [Post!]!
  total: Int!
  pageInfo: OffsetPageInfo
}

type CursorPostEdge {
  cursor: ID!
  node: Post!
}

type CursorPostsResponse {
  edges: [CursorPostEdge!]!
  pageInfo: CursorPageInfo!
  total: Int!
}
# Cursor types end

type ReactionsCount {
  count: Int!
  reacted: Boolean!
}

type ReactionToPostResult {
  reactBy: User!
  mutation: EReactionsMutationStatus!
}

type PostCount {
  published:Int!
  unpublished:Int!
}

input CreatePostInput {
  title: String!
  image: File!
  categories: [ID!]!
  published: Boolean!
  content: String!
  tags: [ID!]!
}


input UpdatePostInput {
  id: ID!
  title: String
  image: File
  categories: [ID!]
  published: Boolean
  content: String
  tags: [ID!]
}

input UpdatePostDraftInput {
  id: ID!
  draft: JSON!
}

input PublishPostInput {
  id: ID!
  title: String
  imageUrl: String
  categories: [ID!]
  tags: [ID!]
}

type Query {
  postsWithOffset(limit: Int, page: Int): OffsetPostsResponse!
  postsWithCursor(limit: Int!, after: ID): CursorPostsResponse!
  # Auth required
  followingAuthorPosts(limit: Int!, after: ID): CursorPostsResponse!
  trendingPosts: [Post!]!
  post(id: ID!): Post!
  postsByTagWithOffset(
    tag: String!
    limit: Int
    page: Int
  ): OffsetPostsResponse!
  postReactionsCount(id: ID!): ReactionsCount!
  postCommentsCount(id: ID!): Int!
  postReactedBy(id: ID!, limit: Int!, after: ID): CursorUserResponse!
  postCount: PostCount!
}

type Mutation {
  createUntitledPost: Post!
  updateDraft(data: UpdatePostDraftInput): String!
  publishPost(data: PublishPostInput): String!
  createPost(data: CreatePostInput): Post!
  updatePost(data: UpdatePostInput): Post!
  deletePost(id: ID!): ID!
  reactionToPost(toId: ID!): EReactionsMutationStatus!
}

enum EReactionsMutationStatus {
  REACT
  WITHDRAW
}

type Subscription {
  reactions(postId: ID!): ReactionToPostResult!
}
