mutation Login($email: String!, $password: String!) {
  login(data: { email: $email, password: $password }) {
    accessToken
    refreshToken
  }
}

mutation Register(
  $name: String
  $email: String!
  $password: String!
  $confirmPassword: String!
  $verificationLink: String!
) {
  register(
    data: {
      name: $name
      email: $email
      password: $password
      confirmPassword: $confirmPassword
      verificationLink: $verificationLink
    }
  )
}

mutation UserVerification($userId: ID!, $code: String!) {
  verifyUser(id: $userId, code: $code)
}

mutation ResendActivationLink($userId: ID!) {
  resendActivation(id: $userId)
}

mutation Logout {
  logout
}

mutation ResetPassword(
  $oldPassword: String!
  $newPassword: String!
  $verificationLink: String!
) {
  resetPassword(
    oldPassword: $oldPassword
    newPassword: $newPassword
    verificationLink: $verificationLink
  )
}

mutation VerifyResetPassword($code: String!) {
  verifyResetPassword(code: $code)
}

# Admin side
mutation DeleteUser($id: String!) {
  deleteUser(id: $id)
}
